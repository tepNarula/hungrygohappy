[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hungrygohappy"
version = "1.0.0"
description = "HungryGoHappy Flet companion application for Android, Desktop, and Web"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prathep Narula", email = "prathep@gmail.com" }
]
keywords = ["food", "restaurants", "roulette", "flet", "flutter", "android"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities"
]
dependencies = [
    "flet>=0.25.0",
    "supabase>=2.10.0",
    "httpx>=0.27.0"
]

[project.scripts]
hungrygohappy = "main:main"

[tool.setuptools]
py-modules = ["main"]
